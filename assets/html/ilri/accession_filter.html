      color: #6a6a78;

      font-size: 14px;
      min-width: 180px;
      background: white;
    }

    #toolbar {

      margin-bottom: 18px;
    }

      font-size: 14px;
      font-weight: 600;

      border-radius: 8px;
      cursor: pointer;

    #btn-download-csv {

    }
    #btn-download-csv:hover {

    #btn-clear-filters {
      background: #f1f1f5;
      color: #55555f;
    }
    #btn-clear-filters:hover {
      background: #e6e6ec;
    }

    .tabulator {
      border: none !important;
      background: transparent !important;
      font-size: 13.5px;
    }
    .tabulator-header {
      background: #fafafe !important;
      border-bottom: 2px solid #ececf3 !important;
    }
    .tabulator-col {
      background: #fafafe !important;
      border-right: none !important;
    }
    .tabulator-col-title {
      color: #3a3a45;
      font-weight: 600;
    }
    .tabulator-row {
      background: white !important;
      border-bottom: 1px solid #f0f0f5 !important;
    }
    .tabulator-row:hover {
      background: #f5f7ff !important;
    }
    .tabulator-row.tabulator-row-even {
      background: #fbfbfe !important;
    }
    .tabulator-cell {
      padding: 8px 10px !important;
    }
    .tabulator-footer {
      background: #fafafe !important;
      border-top: 2px solid #ececf3 !important;
    }
    .tabulator-page.active {
      background: #4C6FFF !important;
      color: white !important;
      border-color: #4C6FFF !important;

    const columnDefs = [{"title": "Accession identifier", "field": "id", "sorter": "string"}, {"title": "Laboratory sample identifier", "field": "id_lab", "sorter": "string"}, {"title": "Taxonomic name", "field": "tax_name", "sorter": "string"}, {"title": "Methane intensity", "field": "methane_intensity", "sorter": "number"}, {"title": "TDDM (%)", "field": "tddm", "sorter": "number"}, {"title": "Methane category", "field": "ch4_category", "sorter": "string"}, {"title": "TDDM category", "field": "tddm_category", "sorter": "string"}, {"title": "LMF category", "field": "lmf_category", "sorter": "string"}, {"title": "Position on LMF category", "field": "lmf_category_rank", "sorter": "number"}];

    const groupOptions = ["All", "Grasses", "Herbaceous_legumes", "Shrub_Trees"];
    const categoryOptions = ["All", "Category_1a", "Category_1b", "Category_2", "Category_3", "Category_4"];


    function populateSelect(selectEl, options) {
      options.forEach(function(opt) {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        selectEl.appendChild(o);
      });
    }

    const groupSelect = document.getElementById("filter-group-select");
    const categorySelect = document.getElementById("filter-category-select");


    populateSelect(groupSelect, groupOptions);
    populateSelect(categorySelect, categoryOptions);


    const table = new Tabulator("#table", {
      data: tableData,
      columns: columnDefs,
      layout: "fitColumns",
      height: "600px",
      pagination: true,
      paginationSize: 25,
      paginationSizeSelector: [10, 25, 50, 100, true],
    });

    function updateRowCount() {
      document.getElementById("row-count").textContent = table.getDataCount("active");
    }

    function applyFilters() {
      const filters = [];
      if (groupSelect.value !== "All") {
        filters.push({ field: "functional_group", type: "=", value: groupSelect.value });
      }
      if (categorySelect.value !== "All") {
        filters.push({ field: "lmf_category", type: "=", value: categorySelect.value });
      }
      table.setFilter(filters);
    }

    groupSelect.addEventListener("change", applyFilters);
    categorySelect.addEventListener("change", applyFilters);


    table.on("tableBuilt", updateRowCount);
    table.on("dataFiltered", updateRowCount);

    // Build the CSV ourselves from the currently filtered ("active")
    // rows, using only the display columns (not the hidden
    // functional_group filter field).
    function toCsv(rows, columns) {
      const fields = columns.map(c => c.field);
      const escape = (val) => {
        if (val === null || val === undefined) return "";
        const s = String(val);
        if (/[",\n]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      };
      const header = fields.map(escape).join(",");
      const lines = rows.map(row => fields.map(f => escape(row[f])).join(","));
      return [header, ...lines].join("\n");
    }

    document.getElementById("btn-download-csv").addEventListener("click", function() {
      const activeRows = table.getData("active");
      const csv = toCsv(activeRows, columnDefs);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "filtered_accessions.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById("btn-clear-filters").addEventListener("click", function() {
      groupSelect.value = "All";
      categorySelect.value = "All";
      table.setFilter([]);
    });
  </script>

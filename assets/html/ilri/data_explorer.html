      padding: 32px;

    .card {

      margin: 0 auto;

    h2 {

      font-weight: 700;

    #meta {

      color: #4a4a5a;
    }
    #toolbar {

      gap: 10px;
      margin-bottom: 18px;
    }
    #toolbar button {
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    #btn-download-csv {
      background: #4C6FFF;
      color: white;
      box-shadow: 0 2px 8px rgba(76, 111, 255, 0.35);
    }
    #btn-download-csv:hover {

    }
    #btn-clear-filters {
      background: #f1f1f5;
      color: #55555f;
    }
    #btn-clear-filters:hover {
      background: #e6e6ec;
    }
    #toolbar button:active {
      transform: scale(0.98);
    }

    /* ---- Tabulator theme overrides: cleaner, less gray ---- */
    .tabulator {
      border: none !important;
      background: transparent !important;
      font-size: 13.5px;
    }
    .tabulator-header {
      background: #fafafe !important;
      border-bottom: 2px solid #ececf3 !important;
    }
    .tabulator-col {
      background: #fafafe !important;
      border-right: none !important;
    }
    .tabulator-col-title {
      color: #3a3a45;
      font-weight: 600;
    }
    .tabulator-row {
      background: white !important;

    }
    .tabulator-row:hover {
      background: #f5f7ff !important;
    }
    .tabulator-row.tabulator-row-even {
      background: #fbfbfe !important;
    }
    .tabulator-cell {
      padding: 8px 10px !important;
    }
    .tabulator-header-filter input,
    .tabulator-header-filter select {
      border: 1px solid #e2e2ec !important;
      border-radius: 6px !important;
      padding: 4px 6px !important;
    }
    .tabulator-footer {
      background: #fafafe !important;
      border-top: 2px solid #ececf3 !important;
    }
    .tabulator-paginator {
      color: #55555f;
    }
    .tabulator-page {
      border-radius: 6px !important;
    }
    .tabulator-page.active {
      background: #4C6FFF !important;
      color: white !important;
      border-color: #4C6FFF !important;
    }

    /* ---- Per-column header accent colors ---- */
    
    .tabulator-col[tabulator-field="id"] {
      background: #EEF1FF !important;
    }
    .tabulator-col[tabulator-field="id"] .tabulator-col-title {
      color: #3B4FCC !important;

    // Build the CSV ourselves from the currently filtered ("active")
    // rows, so the download always matches exactly what's on screen.
    function toCsv(rows, columns) {
      const fields = columns.map(c => c.field);
      const escape = (val) => {
        if (val === null || val === undefined) return "";
        const s = String(val);
        if (/[",\n]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      };
      const header = fields.map(escape).join(",");
      const lines = rows.map(row => fields.map(f => escape(row[f])).join(","));
      return [header, ...lines].join("\n");
    }

    document.getElementById("btn-download-csv").addEventListener("click", function() {
      const activeRows = table.getData("active");
      const csv = toCsv(activeRows, columnDefs);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "filtered_data.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

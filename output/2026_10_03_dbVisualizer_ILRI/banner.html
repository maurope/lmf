
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Functional Group Banner</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .dashboard {
      display: flex;
      align-items: stretch;
      gap: 20px;
    }

    .groups {
      display: flex;
      gap: 16px;
    }

    .total-box {
      width: 220px;
      background: purple;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      transition: background 0.2s ease;
    }
    .total-label {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .total-count {
      font-size: 48px;
      font-weight: bold;
    }
    .total-percent {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .total-percent-big {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      width: 100%;
    }
    .total-percent-caption {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 2px;
      text-align: center;
      width: 100%;
    }
    .total-box:hover .total-count {
      display: none;
    }
    .total-box:hover .total-percent {
      display: flex;
    }
    /* Hovering ANY box (group, sub-box, or total) grays out every
       OTHER box in the whole dashboard — regardless of type or
       group. Only the exact box under the cursor keeps its color. */
    .dashboard:hover .group-box:not(:hover),
    .dashboard:hover .sub-box:not(:hover),
    .dashboard:hover .total-box:not(:hover) {
      background: #B0B0B0 !important;
    }

    .group-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group-box {
      width: 300px;
      height: 130px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      transition: background 0.2s ease;
    }
    /* (Cross-box graying handled by the single global rule above.) */
    .group-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .group-count {
      font-size: 40px;
      font-weight: bold;
    }
    .group-percent {
      font-size: 40px;
      font-weight: bold;
      display: none;
    }
    .group-box:hover .group-count {
      display: none;
    }
    .group-box:hover .group-percent {
      display: block;
    }

    .sub-boxes-row {
      display: flex;
      gap: 6px;
    }

    .sub-box {
      flex: 1;
      height: 70px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .sub-box-label {
      font-size: 11px;
      font-weight: bold;
    }
    .sub-box-count {
      font-size: 18px;
      font-weight: bold;
    }
    .sub-box-percent {
      font-size: 15px;
      font-weight: bold;
      display: none;
    }
    .sub-box:hover .sub-box-count {
      display: none;
    }
    .sub-box:hover .sub-box-percent {
      display: block;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="total-box">
      <div class="total-label">Total sampled</div>
      <div class="total-count">392</div>
      <div class="total-percent">

  </div>

</body>
</html>

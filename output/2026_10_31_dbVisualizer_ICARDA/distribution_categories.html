cabrum (1)", "Trifolium scutatum (1)", "Trifolium sp. (1)", "Trifolium spadiceum  (1)", "Trifolium speciosum (1)", "Trifolium spumosum (1)", "Trifolium squamosum (1)", "Trifolium squarrosum (1)", "Trifolium striatum (1)", "Trifolium tomentosum  (1)", "Trifolium tomentosum var. cthonocephalum (1)", "Trifolium tomentosum var. glabrescens (1)", "Trifolium vesiculosum (1)", "Vicia aintabensis (1)", "Vicia anatolica (1)", "Vicia articulata (1)", "Vicia assyriaca (1)", "Vicia bithynica (4)", "Vicia cracca (1)", "Vicia dionysiensis (1)", "Vicia galilaea (1)", "Vicia grandiflora (1)", "Vicia hyaeniscyamus (2)", "Vicia hyrcanica (2)", "Vicia johannis var. johannis (3)", "Vicia johannis var. procumbens (1)", "Vicia lunata (1)", "Vicia lutea (2)", "Vicia lutea subsp. lutea (4)", "Vicia melanops (5)", "Vicia michauxii (1)", "Vicia monantha (3)", "Vicia monantha subsp. monantha (8)", "Vicia monantha subsp. triflora (5)", "Vicia montbretii (1)", "Vicia narbonensis (5)", "Vicia narbonensis var. affinis (2)", "Vicia narbonensis var. jordanica (2)", "Vicia narbonensis var. narbonensis (1)", "Vicia narbonensis var. salmonea (2)", "Vicia pannonica (2)", "Vicia pannonica subsp. pannonica (4)", "Vicia pannonica subsp. striata (1)", "Vicia peregrina (8)", "Vicia sativa (4)", "Vicia sativa subsp. amphicarpa (1)", "Vicia sativa subsp. cordata (19)", "Vicia sativa subsp. macrocarpa (8)", "Vicia sativa subsp. nigra (13)", "Vicia sativa subsp. sativa var. immaculata (2)", "Vicia sativa subsp. sativa var. leucosperma f. alba (1)", "Vicia sativa subsp. sativa var. platysperma (2)", "Vicia sericocarpa (3)", "Vicia serratifolia (1)", "Vicia sp. (1)", "Vicia tenuifolia (1)", "Vicia villosa (5)", "Vicia villosa subsp. dasycarpa (5)", "Vicia villosa subsp. varia (1)", "Vicia villosa subsp. villosa (10)", "hordeum vulgare (37)", "lathyrus aphaca var. aphaca (1)", "lathyrus latifolius (1)", "lathyrus pratense (1)", "trifolium anatolicum (1)", "trifolium argutum (1)", "trifolium pratense (7)", "trifollium stellatum (1)", "vicia ervillia (2)", "vicia hybrida (2)", "vicia lutea subsp. Vestita (2)", "vicia narbonensis var. aegyptiaca (1)", "vicia noeana (1)", "vicia palaestina (1)", "vicia sativa subsp. Sativa (1)", "vicia sativa subsp. Sativa var. melanosperma (1)"];
    const yearOptions = ["All"];
    const subsetOptions = ["All", "1"];

    function populateSelect(selectEl, values, labels) {
      values.forEach(function(val, i) {
        const o = document.createElement("option");
        o.value = val;
        o.textContent = labels ? labels[i] : val;
        selectEl.appendChild(o);
      });
    }

    const groupSelect = document.getElementById("filter-group-select");
    const speciesSelect = document.getElementById("filter-species-select");
    const yearSelect = document.getElementById("filter-year-select");
    const subsetSelect = document.getElementById("filter-subset-select");

    populateSelect(groupSelect, groupOptions);
    populateSelect(speciesSelect, speciesValues, speciesLabels);
    populateSelect(yearSelect, yearOptions);
    populateSelect(subsetSelect, subsetOptions);

    // Build the Tabulator column definitions once: species name,
    // one column per category, then Total.
    const columnDefs = [
      { title: "Functional group", field: "functional_group", sorter: "string" },
      { title: "Species", field: "tax_name", sorter: "string", widthGrow: 2 },
      ...categoryOrder.map(function(cat) {
        return {
          title: cat.replace("Category_", "Category "),
          field: cat,
          sorter: "number",
          hozAlign: "center"
        };
      }),
      {
        title: "Total",
        field: "Total",
        sorter: "number",
        hozAlign: "center",
        cssClass: "total-col"
      }
    ];

    const table = new Tabulator("#table", {
      data: [],
      columns: columnDefs,
      layout: "fitColumns",
      height: "600px",
      pagination: true,
      paginationSize: 25,
      paginationSizeSelector: [10, 25, 50, 100, true],
      initialSort: [{ column: "Total", dir: "desc" }],
    });

    // Recompute the species x category pivot from rawData, given the
    // currently selected filters — this is what makes the table a
    // live pivot instead of a static one.
    function getFilteredRows(ignoreSpecies) {
      const g = groupSelect.value;
      const sp = ignoreSpecies ? "All" : speciesSelect.value;
      const y = yearSelect.value;
      const s = subsetSelect.value;

      return rawData.filter(function(row) {
        return (g === "All" || row.functional_group === g)
          && (sp === "All" || row.tax_name === sp)
          && (y === "All" || row._year === y)
          && (s === "All" || String(row.subset) === s);
      });
    }

    // Rebuild the Species dropdown so it only lists species that
    // actually have accessions under the currently selected
    // Functional group / Year / Subset (the species filter itself is
    // ignored while computing this, since it's the one being rebuilt).
    function updateSpeciesOptions() {
      const previousSelection = speciesSelect.value;
      const rowsForOtherFilters = getFilteredRows(true);

      const counts = {};
      rowsForOtherFilters.forEach(function(row) {
        counts[row.tax_name] = (counts[row.tax_name] || 0) + 1;
      });

      const availableSpecies = Object.keys(counts).sort();

      speciesSelect.innerHTML = "";
      populateSelect(
        speciesSelect,
        ["All", ...availableSpecies],
        ["All", ...availableSpecies.map(function(name) { return name + " (" + counts[name] + ")"; })]
      );

      // Keep the previous selection if it's still a valid option;
      // otherwise fall back to "All".
      speciesSelect.value = availableSpecies.indexOf(previousSelection) !== -1
        ? previousSelection
        : "All";
    }

    function computePivot() {
      const filtered = getFilteredRows(false);

      const bySpecies = {};
      filtered.forEach(function(row) {
        const sp = row.tax_name;
        if (!bySpecies[sp]) {
          bySpecies[sp] = { tax_name: sp, functional_group: row.functional_group, Total: 0 };
          categoryOrder.forEach(function(cat) { bySpecies[sp][cat] = 0; });
        }
        if (categoryOrder.indexOf(row.lmf_category) !== -1) {
          bySpecies[sp][row.lmf_category] += 1;
        }
        bySpecies[sp].Total += 1;
      });

      const pivotRows = Object.values(bySpecies).sort(function(a, b) {
        return b.Total - a.Total;
      });

      table.setData(pivotRows);
      document.getElementById("row-count").textContent = pivotRows.length;
    }

    function onOtherFilterChange() {
      updateSpeciesOptions();
      computePivot();
    }

    table.on("tableBuilt", function() {
      updateSpeciesOptions();
      computePivot();
    });
    groupSelect.addEventListener("change", onOtherFilterChange);
    yearSelect.addEventListener("change", onOtherFilterChange);
    subsetSelect.addEventListener("change", onOtherFilterChange);
    speciesSelect.addEventListener("change", computePivot);

    // Build the CSV directly from whatever the table is currently
    // showing (the live pivot), so the download always matches the
    // screen exactly.
    function toCsv(rows, columns) {
      const fields = columns.map(c => c.field);
      const titles = columns.map(c => c.title);
      const escape = (val) => {
        if (val === null || val === undefined) return "";
        const s = String(val);
        if (/[",\n]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      };
      const header = titles.map(escape).join(",");
      const lines = rows.map(row => fields.map(f => escape(row[f])).join(","));
      return [header, ...lines].join("\n");
    }

    document.getElementById("btn-download-csv").addEventListener("click", function() {
      const activeRows = table.getData();
      const csv = toCsv(activeRows, columnDefs);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "accessions_per_species_category.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById("btn-clear-filters").addEventListener("click", function() {
      groupSelect.value = "All";
      yearSelect.value = "All";
      subsetSelect.value = "All";
      updateSpeciesOptions();
      computePivot();
    });
  </script>
